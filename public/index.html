<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Url Shortner</h1>
      <form id="shorten-form">
        <div>
          <label for="url">Enter the url:</label>
          <input type="url" name="url" id="url" required />
        </div>

        <div>
          <label for="shortCode">Enter the shortCode:</label>
          <input type="text" name="shortCode" id="shortCode" required />
        </div>

        <button type="submit">Shorten</button>
      </form>

      <h2>shortened url</h2>
      <ul id="shortened-urls"></ul>
    </div>

    <script>
      const fetchSortenedurl = async () => {
        const response = await fetch("/links");
        const links = await response.json();
        console.log("links", links);

        const list = document.getElementById("shortened-urls");
        list.innerHTML = "";

        for (const [shortCode, url] of Object.entries(links)) {
          const li = document.createElement("li");
          li.innerHTML = `<a href="/${shortCode}" target="_blank">
      ${window.location.origin}/${shortCode}</a> - ${url}`;
          list.appendChild(li);
        }
      };

      document
        .getElementById("shorten-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const formData = new FormData(event.target);
          const url = formData.get("url");
          const shortCode = formData.get("shortCode");

          try {
            const response = await fetch("/shorten", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url, shortCode }),
            });

            if (response.ok) {
              const data = await response.json();
              fetchSortenedurl();
              alert(
                `Form Submitted succesfully: http://localhost:3002/${data.shortCode}`
              );
              event.target.reset();
            } else {
              alert(await response.text());
            }
          } catch (error) {
            alert("An error occurred: " + error.message);
          }
        });
      fetchSortenedurl();
    </script>
  </body>
</html>
